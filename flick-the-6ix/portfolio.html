<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Flick The 6ix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#0052FF',
                            light: '#F0F5FF',
                            dark: '#003399'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-slate-900 font-sans antialiased flex flex-col min-h-screen">
    
    <!-- Navbar -->
    <nav class="fixed w-full bg-white/90 backdrop-blur-md z-50 border-b border-gray-100 transition-all duration-300 py-4" id="navbar">
        <div class="max-w-7xl mx-auto px-6 md:px-12 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-tight text-slate-900 hover:text-brand-blue transition-colors">Flick The 6ix</a>
            <div class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="index.html" class="text-slate-600 hover:text-brand-blue transition-colors">Home</a>
                <a href="portfolio.html" class="text-brand-blue">Portfolio</a>
                <a href="about.html" class="text-slate-600 hover:text-brand-blue transition-colors">About</a>
                <a href="contact.html" class="text-slate-600 hover:text-brand-blue transition-colors">Contact</a>
            </div>
            <button id="mobile-menu-btn" class="md:hidden text-slate-900 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
            </button>
        </div>
        <div id="mobile-menu" class="hidden absolute top-full left-0 w-full bg-white border-b border-gray-100 py-4 px-6 flex flex-col space-y-4 shadow-lg">
            <a href="index.html" class="text-slate-600 font-medium">Home</a>
            <a href="portfolio.html" class="text-brand-blue font-medium">Portfolio</a>
            <a href="about.html" class="text-slate-600 font-medium">About</a>
            <a href="contact.html" class="text-slate-600 font-medium">Contact</a>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="pt-32 pb-12 px-6 md:px-12 max-w-7xl mx-auto w-full text-center">
        <h1 class="text-5xl font-bold tracking-tight mb-4">Portfolio</h1>
        <p class="text-slate-500 max-w-2xl mx-auto text-lg">A curated collection of my best work across urban, portrait, and lifestyle photography.</p>
    </section>

    <!-- Masonry Grid -->
    <section class="pb-24 px-6 md:px-12 max-w-7xl mx-auto w-full">
        <div class="columns-1 sm:columns-2 lg:columns-3 gap-6 space-y-6" id="gallery-grid">
            <!-- Images are injected via JS or placed here statically -->
            <!-- Image 1 -->
            <div class="relative group cursor-zoom-in overflow-hidden rounded-xl break-inside-avoid gallery-item" data-image="https://images.unsplash.com/photo-1514316454349-750a7fd3da3a?q=80&w=1974&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1514316454349-750a7fd3da3a?q=80&w=800&auto=format&fit=crop" class="w-full h-auto object-cover transition-transform duration-700 group-hover:scale-105" alt="Gallery item">
                <div class="absolute inset-0 bg-brand-blue/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </div>
            <!-- Image 2 -->
            <div class="relative group cursor-zoom-in overflow-hidden rounded-xl break-inside-avoid gallery-item" data-image="https://images.unsplash.com/photo-1522079015949-30138d6ff0a7?q=80&w=2070&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1522079015949-30138d6ff0a7?q=80&w=800&auto=format&fit=crop" class="w-full h-auto object-cover transition-transform duration-700 group-hover:scale-105" alt="Gallery item">
                <div class="absolute inset-0 bg-brand-blue/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </div>
            <!-- Image 3 -->
            <div class="relative group cursor-zoom-in overflow-hidden rounded-xl break-inside-avoid gallery-item" data-image="https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?q=80&w=2070&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?q=80&w=800&auto=format&fit=crop" class="w-full h-auto object-cover transition-transform duration-700 group-hover:scale-105" alt="Gallery item">
                <div class="absolute inset-0 bg-brand-blue/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </div>
             <!-- Image 4 -->
            <div class="relative group cursor-zoom-in overflow-hidden rounded-xl break-inside-avoid gallery-item" data-image="https://images.unsplash.com/photo-1449034446853-66c86144b0ad?q=80&w=2070&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1449034446853-66c86144b0ad?q=80&w=800&auto=format&fit=crop" class="w-full h-auto object-cover transition-transform duration-700 group-hover:scale-105" alt="Gallery item">
                <div class="absolute inset-0 bg-brand-blue/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </div>
            <!-- Image 5 -->
            <div class="relative group cursor-zoom-in overflow-hidden rounded-xl break-inside-avoid gallery-item" data-image="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=2070&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=800&auto=format&fit=crop" class="w-full h-auto object-cover transition-transform duration-700 group-hover:scale-105" alt="Gallery item">
                <div class="absolute inset-0 bg-brand-blue/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </div>
             <!-- Image 6 -->
            <div class="relative group cursor-zoom-in overflow-hidden rounded-xl break-inside-avoid gallery-item" data-image="https://images.unsplash.com/photo-1478144596228-3f59e61239aa?q=80&w=2070&auto=format&fit=crop">
                <img src="https://images.unsplash.com/photo-1478144596228-3f59e61239aa?q=80&w=800&auto=format&fit=crop" class="w-full h-auto object-cover transition-transform duration-700 group-hover:scale-105" alt="Gallery item">
                <div class="absolute inset-0 bg-brand-blue/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </div>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-[100] bg-slate-900/95 backdrop-blur-sm hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <button id="lightbox-close" class="absolute top-6 right-6 text-white hover:text-brand-blue transition-colors focus:outline-none">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <img id="lightbox-img" src="" alt="Full Resolution" class="max-h-[85vh] max-w-[90vw] object-contain rounded-md shadow-2xl scale-95 transition-transform duration-300">
    </div>

    <!-- Footer -->
    <footer class="mt-auto border-t border-gray-100 bg-white py-12">
        <div class="max-w-7xl mx-auto px-6 md:px-12 flex flex-col md:flex-row justify-between items-center">
            <div class="text-2xl font-bold tracking-tight text-slate-900 mb-4 md:mb-0">Flick The 6ix</div>
            <div class="flex space-x-6 text-sm text-slate-500">
                <a href="#" class="hover:text-brand-blue transition-colors">Instagram</a>
                <a href="#" class="hover:text-brand-blue transition-colors">Twitter</a>
                <a href="#" class="hover:text-brand-blue transition-colors">500px</a>
            </div>
            <div class="text-slate-400 text-sm mt-4 md:mt-0">© 2026 Flick The 6ix. All rights reserved.</div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
